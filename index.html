<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- The one line most likely to be the actual cause of "always looks
         mobile" on desktop if it was ever missing or wrong. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>CampusMEET — Ghana's Campus Social Platform</title>
    <meta name="description" content="CampusMEET — the real-identity social platform for university students. Connect, post, react, and build your network across campuses." />

    <!-- Brand color for the browser chrome (address bar on Android Chrome,
         status bar tint in some PWA/homescreen contexts) — matches the
         maroon used throughout the app. -->
    <meta name="theme-color" content="#7a2436" />
    <meta name="background-color" content="#faf6ee" />

    <!-- Favicon + homescreen icons. app-icon-512.png is the optimized
         source generated earlier — update the referenced paths if the
         actual filenames in /public differ. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon-512.png" />

    <!-- PWA — lets "Add to Home Screen" work properly on mobile browsers,
         independent of the Capacitor Android build. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CampusMEET" />

    <!-- Social preview — how a shared campusmeetx.netlify.app link looks
         when pasted into WhatsApp, Twitter/X, Facebook, etc. Point
         og:image at a real hosted 1200x630 image once one exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CampusMEET" />
    <meta property="og:title" content="CampusMEET — Ghana's Campus Social Platform" />
    <meta property="og:description" content="Real students, real campuses. Connect, post, react, and build your network." />
    <meta property="og:image" content="/app-icon-512.png" />
    <meta property="og:url" content="https://campusmeetx.netlify.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CampusMEET" />
    <meta name="twitter:description" content="Real students, real campuses." />
    <meta name="twitter:image" content="/app-icon-512.png" />

    <!-- Preconnect to Google Fonts before global.css's @import fires —
         this is the one thing @import inside CSS can't do on its own,
         and it shaves real time off first paint since the font request
         starts immediately instead of waiting for the CSS to be
         parsed first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevents the classic mobile-browser flash of unstyled white
         background before global.css finishes loading. -->
    <style>
      html, body, #root { height: 100%; margin: 0; background: #faf6ee; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
